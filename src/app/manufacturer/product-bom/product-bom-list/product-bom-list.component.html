<section class="content">
  <div class="content-block">
    <h4 class="mt-4">Product BOM List</h4>
    <div class="card p-4">
      <div class="search-bar">
        <!-- brand -->
        <select name="" class="form-select" [(ngModel)]="filters.brand">
          <option value="">Select Brand</option>
          <option *ngFor="let brand of allBrand" [value]="brand.brandName">{{brand.brandName}}</option>
        </select>

        <!-- Product Type -->
        <select name="" class="form-select" [(ngModel)]="filters.productType" (change)="getCategoryByProductTypeAndGender()">
          <option value="">Select Product Type</option>
          <option *ngFor="let type of allProductType" [value]="type">{{type}}</option>
        </select>

        <!-- Gender -->
        <select name="" class="form-select" [(ngModel)]="filters.gender" (change)="getCategoryByProductTypeAndGender()">
          <option value="">Select Gender</option>
          <option *ngFor="let gender of allGender" [value]="gender">{{gender}}</option>
        </select>

        <!-- category -->
        <select name="" class="form-select" [(ngModel)]="filters.category" (change)="getSubCategoryBYProductType_Gender_and_Category()">
          <option value="">Select Category</option>
          <option *ngFor="let category of allcategory" [value]="category">{{category}}</option>
        </select>

        <!-- sub Category -->
        <select name="" class="form-select" [(ngModel)]="filters.subCategory">
          <option value="">Select Sub-Category</option>
          <option *ngFor="let subCategory of allSubCategory" [value]="subCategory">{{subCategory}}</option>
        </select>

        <button class="btn btn-info" (click)="getAllProducts()">Display</button>
      </div>
      <hr>
      <div class="cards-container">
        <div *ngFor="let product of products" class="product-card" (mouseenter)="onMouseEnter(product)" (mouseleave)="onMouseLeave(product)">
          <div class="design-no">Design No : {{product.designNo}}</div>
          <div class="image-carousel" (click)="navigateToAddBom(product)">
            <img class="main-img" [src]="product.selectedImageUrl" alt="{{product.title}}">
            <div class="carousel-dots">
              <span *ngFor="let img of product.selectedImageUrls; let i = index" [class.active]="i === product.hoverIndex" (click)="navigateToImage(product, i); $event.stopPropagation()"></span>
            </div>
          </div>
          <div class="product-details">
            <div class="color-options mt-0">
              <button *ngFor="let color of product.colors" [ngStyle]="{'background-color': color, 'border': color === '#FFFFFF' ? '1px solid #000' : 'none'}" [class.active]="product.selectedColor === color" [disabled]="disableImage(product,color)" (click)="changeProductImage(product, color)">
              </button>
            </div>
            <h6 class="title" (click)="navigateToAddBom(product)">{{product.title}}</h6>
            <p class="truncate-text">{{ product.description }}</p>
            <!-- <div class="availability">
              <span *ngIf="product.stock > 0" class="in-stock">In stock - Qty {{product.stock}}</span>
              <span *ngIf="product.stock === 0" class="out-of-stock">Out of stock</span>
            </div> -->
            
            <!-- BOM Status Badge -->
            <div class="bom-status">
              <span *ngIf="product.bomFilled" class="bom-completed">
                <i class="pi pi-check-circle"></i> BOM Completed
              </span>
              <span *ngIf="!product.bomFilled" class="bom-pending">
                <i class="pi pi-info-circle"></i> BOM Not Filled
              </span>
            </div>

            <div class="d-flex gap-2 mt-3">
               
               <!-- Button 1: Add or Update BOM -->
               <button class="btn btn-sm flex-grow-1" 
                       [ngClass]="product.bomFilled ? 'btn-outline-primary' : 'btn-primary'"
                       (click)="navigateToAddBom(product); $event.stopPropagation()">
                   <i class="bi" [class.bi-pencil-square]="product.bomFilled" [class.bi-plus-circle]="!product.bomFilled"></i>
                   {{ product.bomFilled ? 'Update BOM' : 'Add BOM' }}
               </button>

               <!-- Button 2: View BOM (Only if BOM exists) -->
               <button *ngIf="product.bomFilled" 
                       class="btn btn-sm btn-outline-secondary" 
                       title="View Details"
                       (click)="navigateToViewBom(product); $event.stopPropagation()">
                   <i class="bi bi-eye"></i> View
               </button>

            </div>
          </div>
        </div>
      </div>
      <p-paginator *ngIf="products && products.length > 0" (onPageChange)="onPageChange($event)" [first]="first" [rows]="rows" [totalRecords]="totalResults" [rowsPerPageOptions]="[10, 20, 30]"></p-paginator>
    </div>
  </div>
</section>
