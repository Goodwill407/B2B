<section class="content">
  <div class="content-block">
    <h4 class="mt-4 page-title">
      <button class="btn navigate" (click)="navigateFun()">
        <i class="bi bi-arrow-left-circle h4"></i>
      </button>
      View Products of Manufacturer - {{ manufacturerCompanyName }}
    </h4>

    <div class="card p-4">
      <div class="search-bar">
        <select class="form-select" [(ngModel)]="filters.brand">
          <option value="">Select Brand</option>
          <option *ngFor="let brand of allBrand" [value]="brand.brandName">{{ brand.brandName }}</option>
        </select>

        <select class="form-select" [(ngModel)]="filters.productType" (change)="getCategoryByProductTypeAndGender()">
          <option value="">Select Product Type</option>
          <option *ngFor="let type of allProductType" [value]="type">{{ type }}</option>
        </select>

        <select class="form-select" [(ngModel)]="filters.gender" (change)="getCategoryByProductTypeAndGender()">
          <option value="">Select Gender</option>
          <option *ngFor="let gender of allGender" [value]="gender">{{ gender }}</option>
        </select>

        <select class="form-select" [(ngModel)]="filters.category" (change)="getSubCategoryBYProductType_Gender_and_Category()">
          <option value="">Select Category</option>
          <option *ngFor="let category of allcategory" [value]="category">{{ category }}</option>
          <option *ngIf="allcategory.length === 0" disabled>** Please Select Product Type and Gender first **</option>
        </select>

        <select class="form-select" [(ngModel)]="filters.subCategory">
          <option value="">Select Sub-Category</option>
          <option *ngFor="let subCategory of allSubCategory" [value]="subCategory">{{ subCategory }}</option>
          <option *ngIf="allSubCategory.length === 0" disabled>** Please Select Category first **</option>
        </select>

        <button class="btn btn-info" (click)="getAllProducts()">Display</button>
      </div>

      <hr>

      <div class="cards-container">
        <div *ngFor="let product of products" class="product-card" (mouseenter)="onMouseEnter(product)" (mouseleave)="onMouseLeave(product)">
          <div class="design-no">Design No : {{ product.designNo }}</div>

          <div class="image-carousel" (click)="openProduct(product)">
            <img
            class="main-img"
            [src]="product.selectedImageUrl || 'assets/images/Product_Alt.jpeg'"
            [alt]="product.title"
            onerror="this.onerror=null; this.src='assets/images/Product_Alt.jpeg';"
            >
            <div class="carousel-dots">
              <span *ngFor="let img of product.selectedImageUrls; let i = index"
                    [class.active]="i === product.hoverIndex"
                    (click)="$event.stopPropagation(); navigateToImage(product, i)"></span>
            </div>
          </div>

          <div class="product-details">
            <div class="color-options mt-0">
              <button *ngFor="let color of product.colors"
                      [ngStyle]="{'background-color': color, 'border': color === '#FFFFFF' ? '1px solid #000' : 'none'}"
                      [class.active]="product.selectedColor === color"
                      [disabled]="disableImage(product, color)"
                      (click)="changeProductImage(product, color)">
              </button>
            </div>

            <h6 class="title" (click)="openProduct(product)">{{ product.title }}</h6>
            <p class="truncate-text">{{ product.description }}</p>

            <button class="btn btn-outline-primary mt-2" (click)="openProduct(product)">
              <i class="bi bi-box-arrow-up-right"></i> View Details
            </button>
          </div>
        </div>
      </div>

      <div *ngIf="products.length === 0" class="empty-state">
        <p>No products available for this manufacturer.</p>
      </div>

      <p-paginator *ngIf="products && products.length > 0"
        (onPageChange)="onPageChange($event)"
        [first]="first"
        [rows]="rows"
        [totalRecords]="totalResults"
        [rowsPerPageOptions]="[10, 20, 30]">
      </p-paginator>
    </div>
  </div>
</section>
