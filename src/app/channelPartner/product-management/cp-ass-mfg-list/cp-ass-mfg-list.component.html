<section class="content">
  <div class="content-block">
    <div class="page-header">
      <button class="btn nav-btn" (click)="navigateFun()">
        <i class="bi bi-arrow-left-circle h4"></i>
      </button>
      <div>
        <h4 class="mb-0"><i class="bi bi-buildings-fill"></i> Connected Manufacturers</h4>
        <small>Manufacturers assigned to your channel partner account</small>
      </div>
    </div>

    <div class="card-table p-3">
      <div class="toolbar">
        <div class="search-box">
          <input
            type="text"
            class="form-control"
            placeholder="Search manufacturer, city or state"
            [(ngModel)]="search"
            (keyup.enter)="onSearch()"
          />
        </div>
        <div class="toolbar-actions">
          <button class="btn btn-search" (click)="onSearch()">
            <i class="bi bi-search"></i> Search
          </button>
          <button class="btn btn-clear" (click)="clearSearch()" *ngIf="search">
            Clear
          </button>
        </div>
      </div>

      <hr>

      <p-table [value]="manufacturers" [tableStyle]="{ 'min-width': '60rem' }">
        <ng-template pTemplate="header">
          <tr>
            <th>Company Name</th>
            <th>Email</th>
            <th>City</th>
            <th>State</th>
            <!-- <th>Status</th> -->
            <th>Action</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-mfg>
          <tr>
            <td>{{ mfg.companyName }}</td>
            <td>{{ mfg.email }}</td>
            <td>{{ mfg.city || '-' }}</td>
            <td>{{ mfg.state || '-' }}</td>
            <!-- <td>
              <span class="status approved" *ngIf="mfg.isApproved">Approved</span>
              <span class="status pending" *ngIf="!mfg.isApproved">Pending</span>
            </td> -->
            <td>
              <button class="btn btn-view" (click)="openProducts(mfg)">
                <i class="fas fa-eye"></i> View Products
              </button>
            </td>
          </tr>
        </ng-template>
      </p-table>

      <div *ngIf="!loading && manufacturers.length === 0" class="data-not-found">
        <p>No connected manufacturers found.</p>
      </div>

      <p-paginator
        *ngIf="manufacturers && manufacturers.length > 0"
        (onPageChange)="onPageChange($event)"
        [first]="first"
        [rows]="rows"
        [totalRecords]="totalResults"
        [rowsPerPageOptions]="[10, 20, 30]">
      </p-paginator>
    </div>
  </div>
</section>
